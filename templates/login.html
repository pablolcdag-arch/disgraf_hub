{% extends "base.html" %}

{% block title %}Login - Disgraf Hub{% endblock %}

{% block content %}
<div class="login-container">
    <div class="glass login-card">
        <h1>Disgraf OS</h1>
        <p>Centro de Comando Integrado</p>
        
        <form method="post" action="/login">
            <div class="form-group">
                <label>Usuario</label>
                <input type="text" name="username" class="form-control" placeholder="Ingrese su usuario" required>
            </div>
            
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-primary">Acceder al Sistema</button>
            
            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}
        </form>
    </div>
</div>
{% endblock %}
