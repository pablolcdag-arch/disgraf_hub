<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Oficio Cartelería{% endblock %}</title>
    <style>
        :root {
            --primary: #2563eb;
            --text-main: #1f2937;
            --text-light: #4b5563;
            --bg-body: #f9fafb;
            --bg-card: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-main);
            background: var(--bg-body);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: var(--bg-card);
            border-bottom: 1px solid #e5e7eb;
            padding: 20px 0;
        }
        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: -0.5px;
        }
        .nav-menu {
            display: flex;
            gap: 20px;
        }
        .nav-menu a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            transition: color 0.2s;
        }
        .nav-menu a:hover {
            color: var(--primary);
        }
        main {
            flex: 1;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        footer {
            background: var(--bg-card);
            border-top: 1px solid #e5e7eb;
            padding: 30px 0;
            text-align: center;
        }
        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            color: var(--text-light);
        }
        .footer-links {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .footer-links a {
            text-decoration: none;
            color: var(--text-light);
            font-size: 14px;
            transition: color 0.2s;
        }
        .footer-links a:hover {
            color: var(--primary);
        }
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <a href="/" class="logo">Oficio Cartelería</a>
            <nav class="nav-menu">
                <a href="/">Inicio</a>
                {% for cat in categories %}
                <a href="/categoria/{{ cat.slug }}.html">{{ cat.name }}</a>
                {% endfor %}
                <a href="/sobre-nosotros.html">Sobre Nosotros</a>
                <a href="/contacto.html">Contacto</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="footer-container">
            <p>&copy; 2026 Oficio Cartelería. Todos los derechos reservados.</p>
            <div class="footer-links">
                <a href="/aviso-legal.html">Aviso Legal</a>
                <a href="/privacidad.html">Privacidad</a>
                <a href="/cookies.html">Cookies</a>
            </div>
        </div>
    </footer>
</body>
</html>
