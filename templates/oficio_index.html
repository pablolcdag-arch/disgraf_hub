<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficio Cartelería | Blog y Tips</title>
    <style>
        :root {
            --primary: #2563eb;
            --text-main: #1f2937;
            --text-light: #4b5563;
            --bg-body: #f9fafb;
            --bg-card: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-main);
            background: var(--bg-body);
            margin: 0;
            padding: 0;
        }
        header {
            background: var(--bg-card);
            border-bottom: 1px solid #e5e7eb;
            padding: 20px 0;
            text-align: center;
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: -0.5px;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .header-title {
            text-align: center;
            margin-bottom: 50px;
        }
        .header-title h1 {
            font-size: 40px;
            color: #111827;
            margin-bottom: 10px;
        }
        .header-title p {
            font-size: 18px;
            color: var(--text-light);
        }
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }
        .blog-card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }
        .blog-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .card-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #e5e7eb;
        }
        .card-content {
            padding: 25px;
        }
        .card-tag {
            color: var(--primary);
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: block;
        }
        .card-title {
            font-size: 20px;
            font-weight: 700;
            color: #111827;
            margin: 0 0 10px 0;
            line-height: 1.3;
        }
        .card-excerpt {
            font-size: 15px;
            color: var(--text-light);
            margin: 0 0 20px 0;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #e5e7eb;
            padding-top: 15px;
            font-size: 13px;
            color: #6b7280;
        }
        .author-ai {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .author-ai::before {
            content: "🤖";
            font-size: 16px;
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">Oficio Cartelería</a>
    </header>

    <div class="container">
        <div class="header-title">
            <h1>Blog para Profesionales Gráficos</h1>
            <p>Descubre técnicas, secretos y los mejores materiales del rubro.</p>
        </div>

        <div class="blog-grid">
            {% for post in posts %}
            <a href="/{{ post.slug }}.html" class="blog-card">
                <img src="{{ post.image_url }}" alt="{{ post.title }}" class="card-img">
                <div class="card-content">
                    <span class="card-tag">{{ post.channel }}</span>
                    <h2 class="card-title">{{ post.title }}</h2>
                    <p class="card-excerpt">{{ post.content | striptags | truncate(150) }}</p>
                    <div class="card-footer">
                        <div class="author-ai">Redacción IA</div>
                        <div>{{ post.published_date }}</div>
                    </div>
                </div>
            </a>
            {% endfor %}
        </div>
    </div>

</body>
</html>
